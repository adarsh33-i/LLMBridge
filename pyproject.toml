[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llmbridge"
version = "0.1.0"
description = "A local Anthropic-to-OpenAI-compatible LLM gateway"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["pypdf>=5"]

[project.optional-dependencies]
ocr = ["PyMuPDF>=1.24"]
token-count = ["tiktoken>=0.8"]

[project.scripts]
llmbridge = "llmbridge.server:main"

[tool.setuptools.packages.find]
include = ["llmbridge*"]
