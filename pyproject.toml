[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llmbridge"
version = "0.1.0"
description = "A local Anthropic-to-OpenAI-compatible LLM gateway"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["pypdf>=5"]

[project.optional-dependencies]
ocr = ["PyMuPDF>=1.24"]
token-count = ["tiktoken>=0.8"]
test = ["pytest>=7", "pytest-cov>=4"]

[project.scripts]
llmbridge = "llmbridge.cli:main"

[tool.setuptools.packages.find]
include = ["llmbridge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["llmbridge"]
omit = ["llmbridge/__main__.py"]

[tool.coverage.report]
show_missing = true
fail_under = 85
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
